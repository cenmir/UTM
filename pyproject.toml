[project]
name = "utm-control"
version = "0.5.4"
description = "Universal Testing Machine control and DIC strain measurement"
requires-python = ">=3.11"
license = { text = "GPL-3.0" }

# ---------------------------------------------------------------------------------------
# ONE dependency set. Every machine gets the same app.
#
# There is no "analysis build". Splitting it produced two things to install, two things to
# support, and a student asking which one they had. pypylon is a pip wheel that bundles its
# own runtime, so it installs anywhere; on a machine with no camera it simply finds no
# device. camera_manager imports it softly and connect_camera() refuses with a clear message,
# so the app starts and behaves identically whether or not hardware is attached.
#
# What a student CANNOT do on their own laptop is run a test - that needs the rig, and no
# installer changes it. Everything else, including the full UI, works.
#
# pyserial is here even though a laptop never opens a port: serial_manager is imported at
# module load, so the app will not start without it. It is ~100 kB.
#
# The Basler Pylon Camera Software Suite (~2 GB, administrator) is still needed on the RIG
# PC only. It supplies the USB3 Vision kernel driver; without it Windows will not enumerate
# the camera whatever pip has installed. It is not a Python dependency and cannot live here.
# ---------------------------------------------------------------------------------------
dependencies = [
    "PyQt6>=6.6.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "opencv-python>=4.8.0",
    "pyserial>=3.5",
    "pypylon>=3.0.0",
]

[project.optional-dependencies]

# Rebuilding the slide decks and posters in documentation/.
docs = [
    "python-pptx>=0.6.21",
    "pillow>=10.0.0",
    "lxml>=4.9.0",
    "pandas>=2.0.0",
]

# Packaging a Windows executable.
build = ["pyinstaller>=6.0.0"]

[tool.uv]
# Keep the resolver from pulling pypylon unless the rig extra is asked for.
default-groups = []

[tool.setuptools]
# The app modules sit flat in Software/UTM_PyQt6 and import each other by bare name, so
# this is deliberately NOT an installable package - the project exists to pin dependencies
# and give uv something to resolve. Run the app with its own path:
#     uv run --project . python "Software/UTM_PyQt6/main.py"
py-modules = []
